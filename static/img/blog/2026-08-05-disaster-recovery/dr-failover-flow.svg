<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 430" width="650" height="430" role="img" aria-label="A failover walks the two clusters through opposite roles: the outgoing active cluster scales down and optionally cleans up Spark CRDs, then the newly active cluster scales up and runs the CRD sync job." font-family="system-ui, -apple-system, sans-serif">
  <title>Failover sequence between the two IOMETE clusters</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1a1a1a;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e2128;
        --ink: #e8e8e8;
        --accent: #60a5fa;
      }
    }
    text { fill: var(--ink); }
    rect.box { stroke: var(--ink); fill: none; }
    rect.accent { stroke: var(--accent); fill: none; }
    line, path.connector { stroke: var(--ink); fill: none; }
    .dim { opacity: 0.78; }
    .dim2 { opacity: 0.7; }
    marker path { fill: var(--ink); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <!-- Self-contained background: keeps ink/bg paired regardless of the host page's
       background or whether the dark-mode media query is even honored here. -->
  <rect x="0" y="0" width="650" height="430" fill="var(--bg)"/>

  <!-- Lane A -->
  <text x="40" y="26" font-size="14" font-weight="600">CLUSTER A</text>
  <text x="40" y="42" font-size="11" class="dim">currently active</text>

  <rect class="box" x="40" y="60" width="220" height="110" rx="6" stroke-width="1.5"/>
  <text x="50" y="88" font-size="12">1 · Scale down</text>
  <text x="50" y="106" font-size="10" class="dim">saves replica counts</text>
  <text x="50" y="122" font-size="10" class="dim">as annotations, then → 0</text>

  <line x1="260" y1="115" x2="346" y2="115" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="105" font-size="9" class="dim" text-anchor="middle">pods gone</text>

  <rect class="box" x="350" y="60" width="220" height="110" rx="6" stroke-width="1.5"/>
  <text x="360" y="88" font-size="12">2 · Clean up Spark CRDs</text>
  <text x="360" y="106" font-size="10" class="dim">(optional, confirmed first)</text>
  <text x="360" y="122" font-size="10" class="dim">keeps iom-spark-connect*</text>

  <text x="40" y="192" font-size="11" font-style="italic" class="dim">Cluster A is now passive — CronJob unsuspends next cycle.</text>

  <!-- Connector -->
  <path class="connector" d="M570,170 L570,210 L40,210 L40,256" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="204" font-size="11" text-anchor="middle">operator switches to Cluster B</text>

  <!-- Lane B -->
  <text x="40" y="226" font-size="14" font-weight="600">CLUSTER B</text>
  <text x="40" y="242" font-size="11" class="dim">currently passive</text>

  <rect class="box" x="40" y="260" width="220" height="110" rx="6" stroke-width="1.5"/>
  <text x="50" y="288" font-size="12">3 · Scale up</text>
  <text x="50" y="306" font-size="10" class="dim">restores replicas from</text>
  <text x="50" y="322" font-size="10" class="dim">saved annotations</text>

  <line x1="260" y1="315" x2="346" y2="315" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="305" font-size="9" class="dim" text-anchor="middle">ready</text>

  <rect class="accent" x="350" y="260" width="220" height="110" rx="6" stroke-width="2"/>
  <text x="360" y="288" font-size="12">4 · Run CRD sync Job</text>
  <text x="360" y="306" font-size="10" class="dim">Phase 0 cleanup → Phase 1 rebuild</text>
  <text x="360" y="322" font-size="10" class="dim">→ Phase 2 catalog-sync</text>

  <text x="40" y="392" font-size="11" font-style="italic" class="dim">Cluster B is now active — CronJob suspends next cycle.</text>
  <text x="40" y="410" font-size="11" font-style="italic" class="dim">Resubmit aborted jobs after CRD sync? Default: no.</text>
</svg>
